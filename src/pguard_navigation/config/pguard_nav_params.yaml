prm_nav_node:
  ros__parameters:
    use_sim_time: true

    # --- Frames ---
    map_frame: "map"
    base_frame: "base_footprint"

    # --- Carte 
    map_width: 400
    map_height: 400
    resolution: 0.10


    inflation_radius: 1.20

    safety_buffer: 0.45

    prm_clearance_weight: 0.9
    invalid_path_confirm_count: 6

    footprint_front: 0.80
    footprint_back: 0.60
    footprint_half_width: 0.46

    footprint_safety_margin: 0.12
    obstacle_grid_cell_size: 0.3

    max_linear_vel: 0.40
    max_angular_vel: 0.30
    max_linear_accel: 0.7     
    max_angular_accel: 2.0    

  
    lookahead_dist: 0.60

    min_lookahead_dist: 0.8
    lookahead_curvature_full_reduction: 1.2
    local_plan_dt: 0.10
    local_plan_steps: 30

    # --- Planification globale PRM ---
    prm_solve_time: 2.0
    path_check_step: 0.15

    # --- DWA (planificateur local) ---
    dwa_v_step: 0.05
    dwa_w_step: 0.1
    dwa_heading_weight: 1.0
    dwa_goal_weight: 1.2
    dwa_velocity_weight: 1.5
    dwa_obstacle_soft_weight: 1.0
    dwa_path_weight: 1.5
    dwa_path_corridor_slack: 0.25
    dwa_corridor_relax_enter_dist: 0.6
    dwa_corridor_relax_exit_dist: 1.2
    dwa_path_deviation_hard_cap: 1.5

    # --- Approche finale / rotation sur place ---
    goal_tolerance: 0.12
    final_approach_radius: 0.6
    dwa_final_approach_heading_scale: 0.2
    dwa_final_approach_goal_scale: 1.5
    turn_in_place_enter_threshold: 1.8
    turn_in_place_exit_threshold: 0.35
    turn_in_place_kp: 1.2

    # --- Watchdog anti-blocage / recuperation ---
    stuck_timeout: 8.0
    stuck_progress_epsilon: 0.03
    safety_stop_recovery_timeout: 2.5
    recovery_rotate_speed: 0.5
    recovery_duration: 2.0
    recovery_backup_speed: 0.15
    recovery_backup_ratio: 0.4
    goal_tolerance_relaxed: 0.25
    max_recovery_attempts: 3

    # --- Capteur / boucle de controle ---
    scan_stride: 3             
    control_period: 0.05

    # --- Couleur du marker de trajectoire locale (topic local_path_marker) ---
    local_path_color_r: 0.0
    local_path_color_g: 0.4
    local_path_color_b: 1.0
    local_path_color_a: 0.9
