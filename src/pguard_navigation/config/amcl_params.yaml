amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"

    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

    max_particles: 3000


    update_min_d: 0.05
    update_min_a: 0.05


    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.5
    laser_max_range: 20.0
    laser_min_range: 0.8
    max_beams: 180
    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    sigma_hit: 0.25
    lambda_short: 0.1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.1

    transform_tolerance: 0.3
    tf_broadcast: true


    resample_interval: 1
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
